[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rlo-sdk"
version = "0.7.0"
description = "rlo SDK -- 일곱 층(Telemetry · Sensor · DC · MS · action · guard · health)을 한 입구로 묶는다"
readme = "README.md"
requires-python = ">=3.10"
# 판본 목록의 원본은 rlo/_pins.py 다. 이 목록은 그것과 글자까지 같아야 한다(tests/test_versions.py).
# guard · health 는 필수다(BD-120 (3)): 선택이면 설치에 따라 MS 런타임의 행동이 조용히 바뀐다.
# action 은 3995fdb 다(stage-3 머리 2f4791e 와 패키지 코드가 같다 -- 까닭은 rlo/_pins.py).
dependencies = [
    "l0-telemetry @ git+https://github.com/cogito5170/Telemetry@35e8119968758becae94f226ce9ee0168967086e",
    "dc @ git+https://github.com/cogito5170/DC@526f2fb487934d1d5c1a930f54ea65de493f34cb",
    "ms @ git+https://github.com/cogito5170/MS@19d850e978f83853edca3ebefdf5c362906ee44c",
    "action-contract @ git+https://github.com/cogito5170/action@3995fdb3ba487f31d841d3e11b710e64f0d523db",
    "guard @ git+https://github.com/cogito5170/guard@be871b9d89fe77badeef901caaa75edc1848f13c",
    "health @ git+https://github.com/cogito5170/health@afcff3960694f58978afec2cdde62cac9e27830f",
]

[project.optional-dependencies]
sensor = ["llmsensor @ git+https://github.com/cogito5170/Sensor@97961e98e6e55b87ea1bbb8483bb99269e5e3900"]

[tool.setuptools]
packages = ["rlo", "rlo.suggest_model"]

[tool.setuptools.package-data]
rlo = ["data/*.json", "data/transcripts/*.jsonl", "data/transcripts/*.json"]
