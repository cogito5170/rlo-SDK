[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "rlo-sdk"
version = "0.11.1"
description = "rlo SDK -- 일곱 층(Telemetry · Sensor · DC · MS · action · guard · health)을 한 입구로 묶는다"
readme = "README.md"
requires-python = ">=3.10"
# 판본 목록의 원본은 rlo/_pins.py 다. 이 목록은 그것과 글자까지 같아야 한다(tests/test_versions.py).
# guard · health 는 필수다(BD-120 (3)): 선택이면 설치에 따라 MS 런타임의 행동이 조용히 바뀐다.
# action 은 9d6729f 다(stage-3 머리 2f4791e 와 패키지 코드가 같다 -- 까닭은 rlo/_pins.py).
dependencies = [
    "l0-telemetry @ git+https://github.com/cogito5170/Telemetry@f6c7ae26d336965d3558092517e97d37d222c4ea",
    "dc @ git+https://github.com/cogito5170/DC@7e0ac1494192e49ab03c687c79f7156cb38abcec",
    "ms @ git+https://github.com/cogito5170/MS@1f1018e0348428c9b83af4f6679659f0057e3f4b",
    "action-contract @ git+https://github.com/cogito5170/action@9d6729fc6809d68d2b5d55b4ad2fd37e5281d998",
    "guard @ git+https://github.com/cogito5170/guard@be871b9d89fe77badeef901caaa75edc1848f13c",
    "health @ git+https://github.com/cogito5170/health@afcff3960694f58978afec2cdde62cac9e27830f",
]

[project.optional-dependencies]
sensor = ["llmsensor @ git+https://github.com/cogito5170/Sensor@ff17bddfd24f6d8cf9c14c0c45107b53818dd26a"]

[tool.setuptools]
packages = ["rlo", "rlo.suggest_model"]

[tool.setuptools.package-data]
rlo = ["data/*.json", "data/transcripts/*.jsonl", "data/transcripts/*.json"]

# CMD-K18: 기본 제공 플러그인도 다른 플러그인과 같은 길(진입점)로 싣는다 -- rlo/plugins.py BUILTINS 와 같아야 한다
[project.entry-points."rlo.transcripts"]
claude_code = "rlo.readers:CLAUDE_CODE"
codex_cli = "rlo.readers:CODEX_CLI"
gemini_cli = "rlo.readers:GEMINI_CLI"

[project.entry-points."rlo.usage"]
anthropic = "rlo.usage_formats:ANTHROPIC"
openai = "rlo.usage_formats:OPENAI"
gemini = "rlo.usage_formats:GEMINI"
otel = "rlo.usage_formats:OTEL"

[project.entry-points."rlo.tokenizers"]
bytes4 = "rlo.usage_formats:BYTES4"
